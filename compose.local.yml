# Local Development Docker Compose Configuration
# Usage: docker compose -f compose.local.yml up -d

services:
  # Azurite - Azure Storage Emulator (Local Development Only)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: aurora-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    volumes:
      - azurite_data:/data
    restart: always
    networks:
      - aurora-network

  # Aurora Postgres Database
  aurora-postgres:
    image: postgres:16
    container_name: aurora-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=AuroraSocialDb
    ports:
      - "5434:5432"
    volumes:
      - aurora_postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aurora Social Application (Server + Client)
  aurora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-app
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@aurora-postgres:5432/AuroraSocialDb?schema=public
      - JWT_SECRET=local-dev-secret-key
      - IFRAMELY_API_KEY=${IFRAMELY_API_KEY}
      # Local Azurite Connection String
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - AZURE_STORAGE_CONTAINER_NAME=screenshots
    ports:
      - "3000:3000"
    depends_on:
      aurora-postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    restart: always
    networks:
      - aurora-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/auth/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  aurora-network:
    driver: bridge

volumes:
  azurite_data:
  aurora_postgres_data:
