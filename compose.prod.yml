version: "3.8"

services:
  # Aurora Social App
  aurora-social:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-social-app
    ports:
      - "${APP_PORT:-3000}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=wealthgrow-postgres
      - DB_NAME=${DB_NAME:-auroraDb}
      - DB_PORT=5432
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@wealthgrow-postgres:5432/${DB_NAME:-auroraDb}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - IFRAMELY_API_KEY=${IFRAMELY_API_KEY}
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    external: true

# Note: Using existing wealthgrow-postgres container
# No need to create separate postgres service
