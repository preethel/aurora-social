services:
  aurora-social:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-social-app
    ports:
      - "${APP_PORT:-3000}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - JWT_SECRET=self_signed_jwt_secret_key_here
      - IFRAMELY_API_KEY=718690c4bc3c1be271bbd3

      # Existing Postgres (wealthgrow-postgres)
      - DB_HOST=wealthgrow-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auroraDb
      - DATABASE_URL=postgresql://postgres:postgres@wealthgrow-postgres:5432/auroraDb?schema=public

      - JWT_SECRET=${JWT_SECRET}
      - IFRAMELY_API_KEY=${IFRAMELY_API_KEY}

    networks:
      - tradingapp_app-network
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tradingapp_app-network:
    external: true
