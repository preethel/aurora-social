version: "3.8"

services:
  aurora-social:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TEST_MODE: ${VITE_TEST_MODE:-true}
    container_name: aurora-social-app
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - IFRAMELY_API_KEY=${IFRAMELY_API_KEY}
      - VITE_TEST_MODE=${VITE_TEST_MODE:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aurora-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aurora-network:
    driver: bridge
