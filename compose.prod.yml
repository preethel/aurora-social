# Production Docker Compose Configuration (Azure)
# Usage: docker compose -f compose.prod.yml up -d
# Note: Azurite is NOT included - uses real Azure Storage

services:
  # Aurora Postgres Database
  aurora-postgres:
    image: postgres:16
    container_name: aurora-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-AuroraSocialDb}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - aurora_postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aurora Social Application (Server + Client)
  aurora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-app
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@aurora-postgres:5432/${DB_NAME:-AuroraSocialDb}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - IFRAMELY_API_KEY=${IFRAMELY_API_KEY}
      # Production Azure Storage Connection String
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-screenshots}
      # Migration will run automatically via Dockerfile CMD
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      aurora-postgres:
        condition: service_healthy
    restart: always
    networks:
      - aurora-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/auth/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  aurora-network:
    driver: bridge

volumes:
  aurora_postgres_data:
