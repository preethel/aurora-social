version: "3.8"

services:
  aurora-social:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-social-app
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - IFRAMELY_API_KEY=${IFRAMELY_API_KEY:-718690c4bc3c1be271bbd3}
      - VITE_TEST_MODE=${VITE_TEST_MODE:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aurora-network
    volumes:
      - ./dist:/app/dist:ro

networks:
  aurora-network:
    driver: bridge
